name: "User test / 使用测评"
description: "Record a real session: what worked and what got in the way. / 记录一次真实使用，包括成功完成的体验和遇到的阻碍。"
title: "[Test] "
body:
  - type: markdown
    attributes:
      value: |
        English or Chinese is welcome. A short report is enough. Describe what you actually tried; skip anything you did not test.
        欢迎使用英文或中文。不需要写长评。请记录你真正尝试过的操作，没测试的部分可以跳过。

        This report is public. Only include screenshots and examples you can share publicly.
        这里的内容会公开显示；截图和示例请使用你可以公开的内容。
  - type: input
    id: app_version
    attributes:
      label: "App version / 软件版本"
      description: "Enter the version or download filename; write “Unknown” if you cannot find it. / 填写版本号或下载包文件名；找不到可写“不清楚”。"
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: "System and equipment / 系统与设备"
      description: "Include the system and version, computer chip if known, and connected devices, interfaces, cables or adapters. Say if no hardware was connected. / 填写系统和版本、电脑芯片（如知道），以及实际连接的设备、接口、线缆或转接器；未连接硬件也请说明。"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: "Task you actually tried / 实际尝试的任务"
      description: "What did you want to accomplish, and what were your main steps? / 你这次想完成什么，主要做了哪些操作？"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: "Outcome / 完成情况"
      options:
        - "Completed smoothly / 顺利完成"
        - "Completed with extra work / 完成了，但需要额外处理"
        - "Partially completed / 只完成了一部分"
        - "Not completed / 没有完成"
        - "Unable to judge yet / 暂时无法判断"
    validations:
      required: true
  - type: textarea
    id: ease_speed
    attributes:
      label: "Ease of use and time / 操作难度与耗时"
      description: "Was it easy to understand? Roughly how long did it take? If comparing with your previous workflow, describe that workflow too. / 是否容易理解？大约花了多久？如果与原来的做法比较，请说出原来怎么做。"
    validations:
      required: false
  - type: textarea
    id: useful
    attributes:
      label: "Most useful aspect / 最有帮助的地方"
      description: "What helped with your actual work? It is fine to say nothing has helped yet. / 哪一处对你的真实工作有帮助？暂时没有也可以直说。"
    validations:
      required: false
  - type: textarea
    id: friction
    attributes:
      label: "Biggest difficulty / 最大的阻碍"
      description: "What was most confusing, time-consuming or disruptive? Include the issue number if you already reported it. / 最困惑、最费时间或最影响使用的地方是什么？如已提交问题反馈，可附上对应编号。"
    validations:
      required: false
  - type: textarea
    id: priority
    attributes:
      label: "One priority / 优先改一件事"
      description: "If the next version could improve only one thing, what should it be? / 如果下一版只能先改一件事，你希望是哪件？"
    validations:
      required: false
